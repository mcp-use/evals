name: Manufact Evals
description: Run Manufact eval suites against an MCP server and fail the job when a suite fails.
author: manufact
branding:
  icon: check-circle
  color: black

inputs:
  token:
    description: Manufact API key. Store it as a repository secret.
    required: true
  server:
    description: Server ID, the UUID in the server's dashboard URL (manufact.com/cloud/<org>/servers/<server-id>/...).
    required: true
  suites:
    description: Suites to run, one per line. Each line is a suite ID, a suite name, or a path to a suite file or folder in the repository (the suite named in the file runs). Leave empty to run every enabled suite.
    required: false
    default: ""
  timeout:
    description: Seconds to wait for the runs to finish. Runs that are still going keep running on Manufact Cloud.
    required: false
    default: "1800"
  fail-on:
    description: "When to fail the job: none or failed."
    required: false
    default: failed
  comment:
    description: "On pull requests, post the results as a comment and update it on later runs. Needs `pull-requests: write`."
    required: false
    default: "true"
  github-token:
    description: Token used to post the pull request comment.
    required: false
    default: ${{ github.token }}

outputs:
  run-ids:
    description: Eval run IDs, one per suite, separated by spaces.
    value: ${{ steps.evals.outputs.run-ids }}
  passed:
    description: true when every suite passed, false otherwise, empty when the suites couldn't run.
    value: ${{ steps.evals.outputs.passed }}
  passed-count:
    description: Number of suites that passed.
    value: ${{ steps.evals.outputs.passed-count }}
  failed-count:
    description: Number of suites that failed, were cancelled, or were still running at the timeout.
    value: ${{ steps.evals.outputs.failed-count }}
  results-file:
    description: Path to the JSON results, with every run and its executions.
    value: ${{ steps.evals.outputs.results-file }}
  dashboard-url:
    description: Link to the server's eval suites in the Manufact dashboard.
    value: ${{ steps.evals.outputs.dashboard-url }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22

    - name: Run evals
      id: evals
      shell: bash
      env:
        MANUFACT_TOKEN: ${{ inputs.token }}
        MANUFACT_SERVER: ${{ inputs.server }}
        INPUT_SUITES: ${{ inputs.suites }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
        GH_TOKEN: ${{ inputs.github-token }}
        # Each release of this action pins the CLI it was tested with.
        # TODO: pin the first @mcp-use/cli release with `evals run --json-file/--markdown-file`.
        CLI_PACKAGE: "@mcp-use/cli@latest"
        NO_COLOR: "1"
      # exec: the script replaces the step's shell, so a cancelled job signals it directly.
      run: 'exec "$GITHUB_ACTION_PATH/scripts/run.sh"'
