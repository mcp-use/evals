name: test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      e2e:
        description: Also run the suites of the test server on Manufact Cloud (spends eval credits).
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck scripts/run.sh test/run.sh
      - name: actionlint
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  mock:
    # The action against a mock Cloud, with the CLI version action.yml pins.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: test/run.sh

  e2e:
    # Real eval runs cost credits, so they only run when asked for.
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: evals
        uses: ./
        continue-on-error: true
        with:
          api-key: ${{ secrets.MANUFACT_TOKEN }}
          server: ${{ vars.EVALS_TEST_SERVER }}
          fail-on: none
      - name: Assert
        env:
          OUTCOME: ${{ steps.evals.outcome }}
          RUN_IDS: ${{ steps.evals.outputs.run-ids }}
          PASSED: ${{ steps.evals.outputs.passed }}
          DASHBOARD: ${{ steps.evals.outputs.dashboard-url }}
        run: |
          echo "outcome=$OUTCOME run-ids=$RUN_IDS passed=$PASSED dashboard=$DASHBOARD"
          test "$OUTCOME" = success
          test -n "$RUN_IDS"
          [[ "$PASSED" =~ ^(true|false)$ ]]
          [[ "$DASHBOARD" == https://* ]]
